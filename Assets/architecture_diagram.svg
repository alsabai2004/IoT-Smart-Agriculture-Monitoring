<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .boxTitle { font: 700 19px Arial, sans-serif; fill: #111827; }
      .boxText { font: 16px Arial, sans-serif; fill: #374151; }
      .arrowText { font: 15px Arial, sans-serif; fill: #374151; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2.2; rx: 18; }
      .accent { fill: #e0f2fe; }
      .accent2 { fill: #dcfce7; }
      .accent3 { fill: #fef3c7; }
      .accent4 { fill: #fde2e2; }
      .line { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" class="title">Smart Agriculture Monitoring - Required IoT Pipeline</text>

  <rect x="40" y="125" width="230" height="160" class="box accent" />
  <text x="155" y="165" text-anchor="middle" class="boxTitle">Virtual Sensors</text>
  <text x="155" y="202" text-anchor="middle" class="boxText">Temperature</text>
  <text x="155" y="230" text-anchor="middle" class="boxText">Humidity</text>
  <text x="155" y="258" text-anchor="middle" class="boxText">Random simulation</text>

  <rect x="320" y="125" width="230" height="160" class="box accent2" />
  <text x="435" y="165" text-anchor="middle" class="boxTitle">Python Publisher</text>
  <text x="435" y="202" text-anchor="middle" class="boxText">JSON formatting</text>
  <text x="435" y="230" text-anchor="middle" class="boxText">Send every 2-3 sec</text>
  <text x="435" y="258" text-anchor="middle" class="boxText">Raw topic</text>

  <rect x="600" y="125" width="230" height="160" class="box accent3" />
  <text x="715" y="165" text-anchor="middle" class="boxTitle">MQTT Broker</text>
  <text x="715" y="202" text-anchor="middle" class="boxText">broker.hivemq.com</text>
  <text x="715" y="230" text-anchor="middle" class="boxText">Pub/Sub channel</text>
  <text x="715" y="258" text-anchor="middle" class="boxText">Unique topics</text>

  <rect x="880" y="125" width="230" height="160" class="box accent4" />
  <text x="995" y="165" text-anchor="middle" class="boxTitle">Gateway</text>
  <text x="995" y="202" text-anchor="middle" class="boxText">Validate JSON</text>
  <text x="995" y="230" text-anchor="middle" class="boxText">Add timestamp</text>
  <text x="995" y="258" text-anchor="middle" class="boxText">Decision logic</text>

  <rect x="1160" y="125" width="200" height="160" class="box accent" />
  <text x="1260" y="165" text-anchor="middle" class="boxTitle">Subscriber</text>
  <text x="1260" y="202" text-anchor="middle" class="boxText">Real-time output</text>
  <text x="1260" y="230" text-anchor="middle" class="boxText">Alert display</text>
  <text x="1260" y="258" text-anchor="middle" class="boxText">Monitoring</text>

  <line x1="270" y1="205" x2="320" y2="205" class="line" />
  <text x="295" y="190" text-anchor="middle" class="arrowText">data</text>

  <line x1="550" y1="205" x2="600" y2="205" class="line" />
  <text x="575" y="190" text-anchor="middle" class="arrowText">publish</text>

  <line x1="830" y1="205" x2="880" y2="205" class="line" />
  <text x="855" y="190" text-anchor="middle" class="arrowText">subscribe</text>

  <line x1="1110" y1="205" x2="1160" y2="205" class="line" />
  <text x="1135" y="190" text-anchor="middle" class="arrowText">processed</text>

  <text x="700" y="356" text-anchor="middle" class="boxText">Raw topic: iot/project/groupX/agriculture/raw | Processed topic: iot/project/groupX/agriculture/processed</text>
</svg>
